<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuton Jarvis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #090b0d; color: #e9edf0; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07); font-weight: 800; letter-spacing: 2px; font-size: 12px; }
  header small { color: #00e68a; }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 11px; border-radius: 10px; line-height: 1.55; max-width: 95%; white-space: pre-wrap; }
  .msg.ai { border: 1px solid rgba(255,255,255,.07); align-self: flex-start; }
  .msg.user { background: #1a1f24; align-self: flex-end; }
  .row { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid rgba(255,255,255,.07); }
  button { background: transparent; border: 1px solid rgba(255,255,255,.13); color: #e9edf0; border-radius: 8px; padding: 7px 10px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: #00e68a; color: #00e68a; }
  button.primary { background: #00e68a; border-color: #00e68a; color: #04120a; font-weight: 700; }
  #in { flex: 1; background: #0e1114; border: 1px solid rgba(255,255,255,.13); color: #e9edf0; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>
<header>TUTON JARVIS <small>V1 · TTS belakangan</small></header>
<div id="log"></div>
<div class="row">
  <button id="b-screen" title="Screenshot layar level OS → OCR/vision (butuh backend Rust)">Baca layarku</button>
  <button id="b-search" title="Cari web via DuckDuckGo (tanpa key)">Cari web</button>
</div>
<div class="row">
  <input id="in" placeholder="Ketik perintah… (Enter kirim)">
  <button id="b-send" class="primary">Kirim</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
