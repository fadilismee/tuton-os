<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 320px; padding: 16px 14px 10px;
    background: #090b0d; color: #e9edf0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px;
  }
  body.light { background: #ffffff; color: #14261c; }
  .brand { display: flex; gap: 10px; align-items: center; }
  .brand svg { width: 30px; height: 30px; display: block; flex: 0 0 auto; }
  .brand h2 { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; white-space: nowrap; }
  .brand .sub { font-size: 9px; color: #5b636b; font-weight: 700; letter-spacing: 2px; }
  body.light .brand .sub { color: #7d968b; }
  .sec-t { font-size: 10px; letter-spacing: 1.4px; color: #5b636b; font-weight: 700; margin: 12px 0 6px; text-transform: uppercase; }
  body.light .sec-t { color: #7d968b; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin: 8px 0; }
  .stat {
    background: #0e1114; border: 1px solid rgba(255,255,255,.07);
    border-radius: 9px; padding: 8px 6px; text-align: center;
  }
  body.light .stat { background: #f4f7f5; border-color: rgba(20,60,40,.12); }
  .stat .k { display: block; font-size: 9px; font-weight: 700; letter-spacing: 1.4px; color: #5b636b; text-transform: uppercase; }
  .stat .n { display: block; font-size: 17px; font-weight: 750; letter-spacing: -.3px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .n.acc { color: #00e68a; }
  body.light .stat .n.acc { color: #00a35c; }
  #status { font-size: 11.5px; color: #8d959d; margin: 2px 1px 4px; }
  #status b { color: #e9edf0; }
  body.light #status { color: #4c6a5c; }
  body.light #status b { color: #14261c; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    width: 100%; padding: 9px 6px; border-radius: 9px;
    cursor: pointer; font-weight: 700; font-size: 12px; margin-top: 6px;
    border: 1px solid rgba(255,255,255,.13); background: transparent; color: #e9edf0;
    font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  body.light button { border-color: rgba(20,60,40,.22); color: #14261c; }
  button:hover { border-color: #00e68a; color: #00e68a; }
  button:disabled { opacity: .45; cursor: default; }
  #open-side { background: #00e68a; border-color: #00e68a; color: #04120a; }
  body.light #open-side { background: #00a35c; border-color: #00a35c; color: #fff; }
  #open-side:hover { background: #2bf09d; color: #04120a; }
  body.light #open-side:hover { background: #00c06e; color: #fff; }
  #checkin { border-color: transparent; color: #8d959d; }
  body.light #checkin { color: #4c6a5c; }
  #checkin:hover { color: #e9edf0; border-color: rgba(255,255,255,.13); }
  #router { font-size: 10px; color: #5b636b; margin-top: 9px; text-align: center; letter-spacing: .3px; }
  .dot { width: 7px; height: 7px; border-radius: 99px; background: #5b636b; display: inline-block; }
  .dot.on { background: #00e68a; }
  .dot.off { background: #ff6b6b; }
  .foot { margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.07); text-align: center; }
  body.light .foot { border-color: rgba(20,60,40,.12); }
  .foot-links { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-bottom: 4px; }
  .foot-links button { width: auto; margin: 0; padding: 3px 7px; font-size: 10.5px; font-weight: 400; border: none; color: #5b636b; }
  body.light .foot-links button { color: #7d968b; }
  .foot-links button:hover { color: #00e68a; border: none; }
  .foot .credit { font-size: 10px; color: #5b636b; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#E8ECEE"/><path d="M10 11.5h12M16 11.5v9" stroke="#090B0D" stroke-width="2.6" stroke-linecap="round"/></svg>
    <div><h2>TUTON OS</h2><div class="sub">LOCAL-FIRST</div></div>
  </div>
  <div class="sec-t">Ringkasan</div>
  <div class="stats">
    <div class="stat"><span class="k">IPK</span><span class="n acc" id="st-ipk">–</span></div>
    <div class="stat"><span class="k">Streak</span><span class="n" id="st-streak">–</span></div>
    <div class="stat"><span class="k">Level</span><span class="n" id="st-level">–</span></div>
  </div>
  <div id="status">…</div>
  <div class="sec-t">Buka cepat</div>
  <div class="grid2">
    <button id="open-side">Sidebar</button>
    <button id="open-float">Ngambang</button>
    <button id="go-ai">AI Agen</button>
    <button id="go-soal">Bank Soal</button>
    <button id="go-tracker">Fokus</button>
    <button id="go-export">Jadikan File</button>
  </div>
  <button id="checkin"><span id="checkin-txt">Check-in harian</span></button>
  <div id="router">…</div>
  <div class="foot">
    <div class="foot-links" id="foot-links"></div>
    <div class="credit">dibuat oleh zerotime.web.id</div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
